services:
  web:
    image: nginx:alpine
    container_name: salao_nginx

    ports:
      - "8096:80"

    volumes:
      - ./src:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php


  php:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: salao_php

    volumes:
      - ./src:/var/www/html

    environment:
      - DB_HOST=mysql
      - DB_NAME=salao_agenda
      - DB_USER=root
      - DB_PASS=secret

      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}

      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_SMTP_SECURE=${MAIL_SMTP_SECURE}
      - MAIL_FROM_EMAIL=${MAIL_FROM_EMAIL}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}

    depends_on:
      - mysql


  mysql:
    image: mysql:8.0
    container_name: salao_mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: salao_agenda

    ports:
      - "33096:3306"

    volumes:
      - mysql_data:/var/lib/mysql


  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: salao_phpmyadmin
    restart: always

    ports:
      - "8097:80"

    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: secret

    depends_on:
      - mysql


volumes:
  mysql_data: